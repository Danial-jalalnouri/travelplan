name: Deploy Tag to Vercel

"on":
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to deploy (e.g. v1.0.0)"
        required: true
        type: string

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch tag
        run: |
          if ! git show-ref --tags --quiet --verify "refs/tags/${{ github.event.inputs.tag }}"; then
            git fetch origin tag "${{ github.event.inputs.tag }}" --no-tags
          fi

      - name: Checkout tag
        run: |
          git checkout "refs/tags/${{ github.event.inputs.tag }}" --force
          git log --oneline -1

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy
        run: vercel --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
