name: Deploy Tag to Vercel

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to deploy (e.g. v1.0.0)'
        required: true
        type: string

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (fetch all tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag exists locally
        run: |
          echo "=== Available local tags ==="
          git tag -l
          echo "=== Looking for tag: ${{ github.event.inputs.tag }} ==="
          git show-ref --tags | grep "${{ github.event.inputs.tag }}" || echo "Tag not found locally"

      - name: Fetch tag from remote if needed
        run: |
          if ! git show-ref --tags --quiet --verify "refs/tags/${{ github.event.inputs.tag }}"; then
            echo "Tag not found locally, fetching from remote..."
            git fetch origin tag "${{ github.event.inputs.tag }}" --no-tags
          fi

      - name: Checkout specific tag
        run: |
          git checkout "refs/tags/${{ github.event.inputs.tag }}" --force
          echo "=== Checked out commit ==="
          git log --oneline -1
          echo "=== Current branch/tag ==="
          git branch -v

      - name: Verify working directory
        run: |
          echo "=== Files in root ==="
          ls -la
          echo "=== Files in backend ==="
          ls -la backend/ 2>/dev/null || echo "No backend dir"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod --yes --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          echo "### Deployed ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "**Tag:** \`${{ github.event.inputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Commit:** \`$(git rev-parse HEAD)\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**URL:** ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"